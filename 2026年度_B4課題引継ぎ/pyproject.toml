[project]
name = "nmrlab-b4-2026"
version = "2026.1"
description = "B4 NMR/MRI laboratory exercises — Python conversion"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-image>=0.24",
    "PyWavelets>=1.7",
    "bm3d>=4.0",
    "openpyxl>=3.1",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "japanize-matplotlib>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
