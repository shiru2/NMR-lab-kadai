[project]
name = "nmrlab-b4-2026"
version = "2026.1"
description = "B4 NMR/MRI laboratory exercises — Python conversion"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "scikit-image>=0.22",
    "PyWavelets>=1.5",
    "bm3d>=4.0",
    "openpyxl>=3.1",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "japanize-matplotlib>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
